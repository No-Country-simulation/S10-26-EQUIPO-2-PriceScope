include:
  - path: ../../../docker-compose.yml

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pricescope.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "15432:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - timescaledb

  scraper:
    build:
      context: ../../..
      dockerfile: apps/scraper/src/Worker/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Hangfire__Dashboard__Username: ${HANGFIRE_DASHBOARD_USERNAME:?Set HANGFIRE_DASHBOARD_USERNAME}
      Hangfire__Dashboard__Password: ${HANGFIRE_DASHBOARD_PASSWORD:?Set HANGFIRE_DASHBOARD_PASSWORD}
      ConnectionStrings__Postgres: Host=timescaledb;Port=5432;Database=pricescope;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      - timescaledb

volumes:
  pgadmin_data:
    driver: local
