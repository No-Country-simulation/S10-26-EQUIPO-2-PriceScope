name: DevSecOps Automated Security & Quality Guard

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Ejecución semanal automatizada (Lunes a las 00:00 UTC) para detectar nuevos CVEs en dependencias existentes
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Security Scan & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Auditoría de Dependencias (SCA) - apps/client
      - name: Run NPM Audit (Client)
        if: hashFiles('apps/client/package.json') != ''
        working-directory: apps/client
        run: |
          npm audit --audit-level=high || echo "::warning title=Vulnerabilities Found::Se detectaron vulnerabilidades en dependencias de apps/client."

      # 2. Análisis Estático de Código (SAST) con Semgrep (OWASP Top 10)
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST Scan (Client)
        run: semgrep scan --config=auto --error apps/client

      # 3. Verificación de Secretos y Credenciales (Gitleaks)
      - name: Secret Leak Prevention
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 4. Ejecución de Tests de Frontend
      - name: Install Client Dependencies
        if: hashFiles('apps/client/package.json') != ''
        working-directory: apps/client
        run: npm ci

      - name: Run Client Tests
        if: hashFiles('apps/client/package.json') != ''
        working-directory: apps/client
        run: |
          npm test --if-present
