name: Deploy scraper to production

on:
  push:
    branches: main
    paths:
      - 'apps/scraper/**'
      - '.github/workflows/cd-scraper-production.yml'

permissions:
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set production image reference
        id: image-reference
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME repository variable to your Docker Hub user or organization."
            exit 1
          fi
          echo "value=docker.io/${DOCKERHUB_USERNAME}/pricescope-scraper:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure Container Apps
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          resourceGroup: pricescope-rg
          containerAppName: ca-scraper-production
          imageToDeploy: ${{ steps.image-reference.outputs.value }}