name: Currency Ingest Runner (DolarAPI -> Neon)

on:
  schedule:
    - cron: '15 * * * *' # Cada hora al minuto 15
  workflow_dispatch:

jobs:
  ingest-currency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies (pg)
        run: npm ci --omit=dev --ignore-scripts

      - name: Fetch DolarAPI and save to Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta configurar el secret DATABASE_URL en GitHub (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          node scripts/ingest-currency.mjs
