name: Deploy scraper to staging

on:
  push:
    branches: [backend-scrapers, whole-scraper]
    paths:
      - 'apps/scraper/**'
      - '.github/workflows/cd-scraper-staging.yml'
      - '.github/workflows/deploy-scraper.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-scraper.yml
    with:
      environment: staging
      resource-group: pricescope-rg
      container-app-name: ca-scraper-staging
    secrets: inherit